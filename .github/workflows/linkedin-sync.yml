# Henter nye LinkedIn-opslag til /nyheder hver morgen (når API-adgangen er godkendt).
# Kræver secret LINKEDIN_ACCESS_TOKEN. Uden den springes jobbet over.
name: LinkedIn → nyheder

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_ORG_ID: "104613890"
    steps:
      - name: Stop, hvis der ikke er et token endnu
        if: env.LINKEDIN_ACCESS_TOKEN == ''
        run: echo "Ingen LINKEDIN_ACCESS_TOKEN – springer over." && exit 0
      - uses: actions/checkout@v4
        if: env.LINKEDIN_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.LINKEDIN_ACCESS_TOKEN != ''
        with:
          node-version: 22
      - name: Hent nye opslag (som kladder)
        if: env.LINKEDIN_ACCESS_TOKEN != ''
        run: node scripts/linkedin/sync.mjs --api --draft
      - name: Commit nye indlæg
        if: env.LINKEDIN_ACCESS_TOKEN != ''
        run: |
          git config user.name "TOBA LinkedIn-sync"
          git config user.email "sofia.elsberg@live.dk"
          git add src/content/news public/nyheder
          git diff --cached --quiet || git commit -m "Nye LinkedIn-opslag til /nyheder (kladder)"
          git push
